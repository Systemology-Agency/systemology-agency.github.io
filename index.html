<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systemology Agency | Coming soon</title>
<meta name="description" content="Something amazing is coming soon from Systemology. Join the waitlist for first access and special launch offers.">
<meta property="og:title" content="Systemology Agency">
<meta property="og:description" content="Something amazing is coming soon. Join the waitlist for special launch offers.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/soon.css">
</head>
<body>
<main class="soon">
  <div class="glow" aria-hidden="true"></div>
  <img class="logo" src="/assets/logo.png" alt="Systemology" width="475" height="75">
  <h1>Something amazing is coming soon.</h1>
  <p class="sub">We're building a new Systemology. Join the waitlist to hear first and get our special launch offers.</p>

  <form id="wl" class="wl" novalidate>
    <div id="wl-fields" class="fields">
      <label class="sr" for="wl-name">First name</label>
      <input id="wl-name" name="first_name" type="text" autocomplete="given-name" placeholder="First name" required>
      <label class="sr" for="wl-email">Email</label>
      <input id="wl-email" name="email" type="email" autocomplete="email" placeholder="Email" required>
      <button id="wl-submit" type="submit">Get notified</button>
    </div>
    <p id="wl-err" class="err" role="alert"></p>
    <div id="wl-done" class="done" hidden>
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>
      <p><b>You're on the list.</b> Watch your inbox for launch offers.</p>
    </div>
  </form>
  <p class="fine">No spam. Unsubscribe anytime.</p>
</main>
<script src="/assets/soon.js"></script>
</body>
</html>
